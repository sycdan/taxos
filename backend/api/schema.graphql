type Query {
	vendors: [Vendor!]!
	vendor(guid: ID!): Vendor
	buckets: [Bucket!]!
	bucket(guid: ID!): Bucket
	receipts(months: [String!], bucket: ID, vendor: ID): [Receipt!]!
	receipt(guid: ID!): Receipt
}

type Mutation {
	createBucket(name: String!): Bucket!
	updateBucket(guid: ID!, name: String!): Bucket!
	deleteBucket(guid: ID!): Boolean!

	createReceipt(input: ReceiptInput!): Receipt!
	updateReceipt(guid: ID!, input: ReceiptInput!): Receipt!
	deleteReceipt(guid: ID!): Boolean!

	upsertVendor(name: String!): Vendor!
	updateVendor(guid: ID!, name: String!): Vendor!

	uploadReceiptFile(hash: String!, filename: String!, data: String!): FileInfo!
}

type Vendor {
	guid: ID!
	name: String!
	receipts: [Receipt!]!
}

type VendorRef {
	guid: ID!
}

type Bucket {
	guid: ID!
	name: String!
	totalAmount: Float!
	receiptCount: Int!
	receipts(months: [String!]): [Receipt!]!
}

type Receipt {
	guid: ID!
	vendor: VendorRef!
	total: Float!
	date: String!
	timezone: String!
	notes: String!
	fileAttachments: [FileAttachment!]!
	reference: String!
	allocations: [Allocation!]!
}

type Allocation {
	amount: Float!
	bucket: Bucket!
}

type FileAttachment {
	hash: String!
	name: String!
}

type FileInfo {
	hash: String!
	filename: String!
	alreadyExists: Boolean!
}

input ReceiptInput {
	vendor: String!
	total: Float!
	date: String!
	timezone: String!
	notes: String
	fileAttachments: [FileAttachmentInput!]
	reference: String
	allocations: [AllocationInput!]
}

input FileAttachmentInput {
	hash: String!
	name: String!
}

input AllocationInput {
	bucketGuid: ID!
	amount: Float!
}
