services:
  taxos-backend:
    container_name: taxos_backend
    image: ${REGISTRY_HOST}/taxos-backend:${TAXOS_VERSION}
    ports:
      - "50052:50052"
    environment:
      - PYTHONPATH=/app
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
    volumes:
      - ${DATA_PATH}:/app/data
    depends_on:
      - neo4j
    restart: unless-stopped

  taxos-frontend:
    container_name: taxos_frontend
    image: ${REGISTRY_HOST}/taxos-frontend:${TAXOS_VERSION}
    ports:
      - "${UI_PORT:-80}:5173"
    environment:
      - VITE_API_URL=http://taxos-backend:50052
    restart: unless-stopped
    depends_on:
      - taxos-backend
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:5173",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  neo4j:
    image: neo4j:5.26.24-enterprise
    container_name: taxos_neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512m}
    ports:
      - "7474:7474" # browser
      - "7687:7687" # bolt
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  backup:
    container_name: taxos_backup
    image: ${REGISTRY_HOST}/taxos-backend:${TAXOS_VERSION}
    command: ["python", "/app/taxos/tenant/backup/scheduler.py"]
    environment:
      - PYTHONPATH=/app
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - BACKUP_HOUR=${BACKUP_HOUR:-2}
      - TAXOS_PRUNE_KEEP_DAILY=${TAXOS_PRUNE_KEEP_DAILY:-7}
      - TAXOS_PRUNE_KEEP_WEEKLY=${TAXOS_PRUNE_KEEP_WEEKLY:-5}
      - TAXOS_PRUNE_KEEP_MONTHLY=${TAXOS_PRUNE_KEEP_MONTHLY:-13}
      - TAXOS_PRUNE_KEEP_YEARLY=${TAXOS_PRUNE_KEEP_YEARLY:-3}
    volumes:
      - ${DATA_PATH}:/app/data
    depends_on:
      - neo4j
    restart: unless-stopped

volumes:
  neo4j_data:
