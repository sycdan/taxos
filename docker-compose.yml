services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ${CODE_ROOT:-.}/backend:/app
      - debugpy-vol:/debugpy-vol # shared with sidecar: contains debugpy + inject script
    working_dir: /app
    ports:
      - "50052:50052"
      - "5678:5678" # debugpy via sidecar (shares this network namespace)
    environment:
      - PYTHONPATH=/app:/debugpy-vol # /debugpy-vol populated by sidecar at runtime
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      - neo4j
    # init: true ensures Python is NOT PID 1 — PID 1 cannot be ptrace'd by gdb
    init: true
    # -Xfrozen_modules=off is required for debugpy to instrument stdlib correctly
    command: ["python", "-Xfrozen_modules=off", "api/graphql_server.py"]
    # Hot reload for dev: compose watch restarts the container when source files
    # change. The bind mount means the new code is already in place on restart.
    # The debug sidecar loop re-attaches debugpy automatically after each restart.
    develop:
      watch:
        - action: rebuild
          path: ${CODE_ROOT:-.}/backend
          ignore:
            - __pycache__/
            - "*.pyc"
            - data/

  backend-debug:
    build:
      context: ./dev/debug
      dockerfile: Dockerfile
    volumes:
      - debugpy-vol:/debugpy-vol # sidecar populates this; backend reads from it
    pid: "service:backend" # share PID namespace so pgrep can see backend procs
    network_mode: "service:backend" # uses backend's network (port 5678 is mapped there)
    cap_add:
      - SYS_PTRACE # required for gdb to inject into the backend process
    # No automatic restart — the sidecar runs once per attach (via the VS Code
    # launch task) and exits after injecting debugpy.  Re-run the task to re-attach
    # after a hot-reload.
    restart: "no"
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ${CODE_ROOT:-.}/frontend:/app
    ports:
      - "5173:5173"
    environment: []

  neo4j:
    image: neo4j:5.26.24-enterprise
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474" # browser
      - "7687:7687" # bolt
    volumes:
      - neo4j_data:/data

volumes:
  debugpy-vol: # ephemeral: sidecar copies debugpy here at startup
  neo4j_data:
